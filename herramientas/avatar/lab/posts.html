<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff}</style>
<script type="importmap">{"imports":{"three":"../../../vendor/three/three.module.min.js","three/addons/":"../../../vendor/three/addons/"}}</script>
</head><body>
<script type="module">
// Herramienta (solo desarrollo): imágenes propias de las publicaciones de la rueda.
// Todo es geometría y materiales hechos aquí, sin marcas ni logotipos.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 720, H = 600;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(2);
r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(r.domElement);
const pm = new THREE.PMREMGenerator(r);
const entorno = pm.fromScene(new RoomEnvironment(), 0.04).texture;

// Tela clara con trama (normal map procedural)
function tela(rep = 6) {
  const L = 512, c = document.createElement('canvas'); c.width = c.height = L;
  const x = c.getContext('2d'); const img = x.createImageData(L, L);
  const h = new Float32Array(L * L);
  for (let y = 0; y < L; y++) for (let i = 0; i < L; i++) {
    const tr = Math.sin(i * 0.9) * 0.5 + Math.sin(y * 0.9 + Math.sin(i * 0.15) * 2) * 0.5;
    h[y * L + i] = tr * 0.6 + Math.random() * 0.8;
  }
  for (let y = 0; y < L; y++) for (let i = 0; i < L; i++) {
    const dx = h[y * L + (i + 1) % L] - h[y * L + (i - 1 + L) % L];
    const dy = h[((y + 1) % L) * L + i] - h[((y - 1 + L) % L) * L + i];
    const l = Math.hypot(dx, dy, 1.4), o = (y * L + i) * 4;
    img.data[o] = (-dx / l * 0.5 + 0.5) * 255; img.data[o + 1] = (-dy / l * 0.5 + 0.5) * 255; img.data[o + 2] = (1.4 / l * 0.5 + 0.5) * 255; img.data[o + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep);
  return t;
}

function escenaBase(fondo = '#F4F4F2') {
  const e = new THREE.Scene(); e.background = new THREE.Color(fondo);
  e.environment = entorno; e.environmentIntensity = 0.38;
  e.add(new THREE.HemisphereLight(0xffffff, 0xdfe2e6, 0.3));
  return e;
}
function sol(e, x, y, z, i = 2.2, area = 3) {
  const s = new THREE.DirectionalLight(0xfffaf3, i); s.position.set(x, y, z); s.castShadow = true;
  s.shadow.mapSize.set(2048, 2048); s.shadow.radius = 14; s.shadow.blurSamples = 24;
  Object.assign(s.shadow.camera, { left: -area, right: area, top: area, bottom: -area, near: 0.1, far: 30 });
  s.shadow.bias = -0.0004; e.add(s); return s;
}
const foto = (e, cam) => { r.render(e, cam); return r.domElement.toDataURL('image/webp', 0.88); };
const lathe = (pts, seg = 96) => new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg);
function suavizar(pts, n = 6) {   // curva suave entre puntos de control
  const c = new THREE.SplineCurve(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  return c.getPoints(pts.length * n).map(p => [Math.max(0, p.x), p.y]);
}

// ---------- IMAGEN: peón con sombra de reina ----------
window.imagen = () => {
  const e = escenaBase('#F6F6F4');
  const suelo = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: '#F6F6F4', roughness: 1 }));
  suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; e.add(suelo);
  const peon = lathe(suavizar([[0, 0], [0.42, 0], [0.43, 0.05], [0.4, 0.11], [0.33, 0.15], [0.3, 0.2], [0.22, 0.26], [0.16, 0.5], [0.14, 0.72], [0.24, 0.76], [0.24, 0.8], [0.12, 0.84], [0.17, 0.9], [0.21, 1.0], [0.19, 1.1], [0.1, 1.17], [0, 1.18]], 5));
  const mPeon = new THREE.MeshPhysicalMaterial({ color: '#2B2E33', roughness: 0.22, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.08 });
  const p = new THREE.Mesh(peon, mPeon); p.castShadow = false; e.add(p);
  // La reina solo existe como sombra: no se dibuja, pero bloquea la luz
  const reina = lathe(suavizar([[0, 0], [0.5, 0], [0.48, 0.12], [0.36, 0.2], [0.26, 0.32], [0.18, 0.9], [0.16, 1.5], [0.3, 1.58], [0.22, 1.66], [0.28, 1.9], [0.36, 2.1], [0.12, 2.18], [0.08, 2.3], [0, 2.32]], 5));
  const mInv = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
  const q = new THREE.Mesh(reina, mInv); q.castShadow = true; e.add(q);
  for (let i = 0; i < 8; i++) {   // corona
    const pico = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.24, 8), mInv);
    const a = i / 8 * Math.PI * 2; pico.position.set(Math.cos(a) * 0.3, 2.22, Math.sin(a) * 0.3); pico.castShadow = true; e.add(pico);
  }
  const bola = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), mInv); bola.position.y = 2.42; bola.castShadow = true; e.add(bola);
  const s = sol(e, -6, 5.0, 1.6, 3.0, 6); s.shadow.radius = 5;
  const cam = new THREE.PerspectiveCamera(24, W / H, 0.1, 100);
  cam.position.set(0.9, 4.2, 6.6); cam.lookAt(1.3, 0.25, -0.3);
  return foto(e, cam);
};

// ---------- ESTUDIOS: escritorio con portátil genérico, café y mando ----------
window.estudios = () => {
  const e = escenaBase('#EDEDEA');
  const mesa = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: '#EEEDEA', roughness: 0.95, normalMap: tela(26), normalScale: new THREE.Vector2(0.55, 0.55) }));
  mesa.rotation.x = -Math.PI / 2; mesa.receiveShadow = true; e.add(mesa);
  // Portátil cerrado, aluminio gris, sin ningún logotipo
  const alu = new THREE.MeshPhysicalMaterial({ color: '#9EA2A8', metalness: 0.85, roughness: 0.32, clearcoat: 0.3 });
  const port = new THREE.Mesh(new RoundedBoxGeometry(3.1, 0.16, 2.15, 6, 0.08), alu);
  port.position.set(0.9, 0.08, 1.25); port.rotation.y = 0.55; port.castShadow = true; port.receiveShadow = true; e.add(port);
  const junta = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.012, 2.05), new THREE.MeshStandardMaterial({ color: '#55595f', roughness: 0.6 }));
  junta.position.copy(port.position); junta.position.y = 0.08; junta.rotation.y = 0.55; e.add(junta);
  // Taza de café con plato y cucharilla
  const porc = new THREE.MeshPhysicalMaterial({ color: '#FBFBFA', roughness: 0.18, clearcoat: 0.8 });
  const plato = new THREE.Mesh(lathe(suavizar([[0, 0.0], [0.5, 0.0], [0.62, 0.03], [0.7, 0.08], [0.69, 0.09], [0.6, 0.05], [0.3, 0.035], [0, 0.035]], 4)), porc);
  plato.position.set(-1.75, 0, -1.05); plato.castShadow = true; plato.receiveShadow = true; e.add(plato);
  const taza = new THREE.Mesh(lathe(suavizar([[0, 0.04], [0.2, 0.04], [0.3, 0.12], [0.33, 0.35], [0.34, 0.52], [0.31, 0.52], [0.3, 0.36], [0.28, 0.15], [0, 0.12]], 4)), porc);
  taza.position.set(-1.78, 0.03, -1.07); taza.castShadow = true; e.add(taza);
  const asa = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.028, 12, 32, Math.PI * 1.2), porc);
  asa.position.set(-1.78, 0.33, -0.72); asa.rotation.set(0, Math.PI / 2, -Math.PI / 2 + 0.3); e.add(asa);
  const cafe = new THREE.Mesh(new THREE.CircleGeometry(0.3, 48), new THREE.MeshStandardMaterial({ color: '#8C6A4F', roughness: 0.4 }));
  cafe.rotation.x = -Math.PI / 2; cafe.position.set(-1.78, 0.47, -1.07); e.add(cafe);
  const crema = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.3, 48), new THREE.MeshStandardMaterial({ color: '#B89574', roughness: 0.5 }));
  crema.rotation.x = -Math.PI / 2; crema.position.set(-1.78, 0.472, -1.07); e.add(crema);
  const acero = new THREE.MeshStandardMaterial({ color: '#C9CCD0', metalness: 1, roughness: 0.2 });
  const cuch = new THREE.Group();
  const mango = new THREE.Mesh(new THREE.CapsuleGeometry(0.025, 0.7, 4, 12), acero); mango.rotation.z = Math.PI / 2; cuch.add(mango);
  const pala = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 12), acero); pala.scale.set(1.4, 0.25, 0.9); pala.position.x = -0.42; cuch.add(pala);
  cuch.position.set(-1.25, 0.06, -0.85); cuch.rotation.y = -1.1; cuch.traverse(o => { o.castShadow = true; }); e.add(cuch);
  // Mando a distancia genérico
  const mando = new THREE.Mesh(new RoundedBoxGeometry(0.42, 0.1, 1.6, 4, 0.05), new THREE.MeshStandardMaterial({ color: '#1E2024', roughness: 0.35 }));
  mando.position.set(2.0, 0.05, -1.25); mando.rotation.y = -0.85; mando.castShadow = true; e.add(mando);
  const aro = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.012, 8, 32), new THREE.MeshStandardMaterial({ color: '#3a3d43', roughness: 0.3 }));
  aro.rotation.x = -Math.PI / 2; aro.position.set(0.12, 0.1, 0.25); mando.add(aro); aro.position.set(0, 0.051, 0.18);
  sol(e, -3, 7, 3.5, 2.4, 5);
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
  cam.position.set(0, 8.2, 0.9); cam.lookAt(0, 0, -0.1);
  return foto(e, cam);
};

// ---------- SALUD: esterilla, mancuernas y botella ----------
window.salud = () => {
  const e = escenaBase('#EEF1EE');
  const suelo = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: '#F1F2EF', roughness: 0.95 }));
  suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; e.add(suelo);
  // Esterilla extendida con el extremo enrollado
  const salvia = new THREE.MeshStandardMaterial({ color: '#C3CFC5', roughness: 0.9 });
  const est = new THREE.Mesh(new RoundedBoxGeometry(2.0, 0.04, 4.2, 2, 0.02), salvia);
  est.position.set(-0.4, 0.02, 0.4); est.rotation.y = 0.18; est.receiveShadow = true; est.castShadow = true; e.add(est);
  const rollo = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2.0, 48), salvia);
  rollo.rotation.z = Math.PI / 2; rollo.position.set(-0.78, 0.3, -1.65); rollo.rotation.y = 0.18; rollo.castShadow = true; e.add(rollo);
  const espiral = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.012, 8, 48), new THREE.MeshStandardMaterial({ color: '#9FB6A5', roughness: 0.9 }));
  espiral.position.set(0.24, 0.3, -1.84); espiral.rotation.y = Math.PI / 2 + 0.18; e.add(espiral);
  // Mancuernas
  const gris = new THREE.MeshPhysicalMaterial({ color: '#E3E5E8', roughness: 0.35, clearcoat: 0.6 });
  const metal = new THREE.MeshStandardMaterial({ color: '#BFC3C8', metalness: 0.9, roughness: 0.25 });
  function mancuerna(x, z, ang) {
    const g = new THREE.Group();
    for (const s of [-1, 1]) {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.32, 6), gris); p.rotation.z = Math.PI / 2; p.position.x = s * 0.42; g.add(p);
    }
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.6, 24), metal); b.rotation.z = Math.PI / 2; g.add(b);
    g.position.set(x, 0.26, z); g.rotation.y = ang; g.traverse(o => { o.castShadow = true; }); e.add(g);
  }
  mancuerna(1.55, 0.2, 0.9); mancuerna(1.9, 1.15, 0.7);
  // Botella de agua mate
  const bot = new THREE.Mesh(lathe(suavizar([[0, 0], [0.26, 0], [0.28, 0.06], [0.28, 1.25], [0.24, 1.38], [0.16, 1.44], [0.16, 1.6], [0, 1.6]], 4)), new THREE.MeshPhysicalMaterial({ color: '#F7F7F5', roughness: 0.45, clearcoat: 0.4 }));
  bot.rotation.z = Math.PI / 2; bot.rotation.y = -0.6; bot.position.set(1.0, 0.28, 2.05); bot.castShadow = true; e.add(bot);
  const tapon = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.22, 32), new THREE.MeshStandardMaterial({ color: '#2B3142', roughness: 0.5 }));
  tapon.position.set(0, 1.68, 0); bot.add(tapon);
  sol(e, -3.5, 7, 3, 2.3, 5);
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
  cam.position.set(0.3, 8.6, 1.5); cam.lookAt(0.4, 0, 0.15);
  return foto(e, cam);
};
window.listo = true;
</script></body></html>
