<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen · Prueba de avatares</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/v2.css">
<style>
  body { margin: 0; font-family: var(--fuente); color: var(--tinta); background: var(--porcelana); min-height: 100vh; }
  .pa { max-width: 1180px; margin: 0 auto; padding: 28px 20px 40px; display: grid; gap: 20px; }
  .pa h1 { font: 500 clamp(30px, 4vw, 44px)/1 var(--fuente-titulo); letter-spacing: -.05em; margin: 0; }
  .pa p { margin: 6px 0 0; color: var(--tinta-3); font-size: 14px; max-width: 70ch; line-height: 1.5; }
  .pa-escena { position: relative; height: min(70vh, 640px); border-radius: 30px; overflow: hidden; background: radial-gradient(55% 55% at 50% 60%, #FBFBFB 0%, #F2F3F3 55%, var(--porcelana) 100%); box-shadow: var(--relieve); border: 1px solid rgba(255,255,255,.75); }
  .pa-escena canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .pa-slots { position: absolute; left: 0; right: 0; top: 16px; display: flex; justify-content: space-around; pointer-events: none; }
  .pa-slot { display: grid; justify-items: center; gap: 8px; pointer-events: auto; }
  .pa-slot b { font: 600 13px var(--fuente); letter-spacing: .04em; color: var(--tinta-3); text-transform: uppercase; }
  .pa-slot .fila { display: flex; gap: 8px; }
  .pa-slot label { cursor: pointer; }
  .pa-slot input[type=file] { display: none; }
  .pa-anim { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(238,240,240,.7); box-shadow: var(--hundido); backdrop-filter: blur(12px); }
  .pa-anim button { border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; font: 500 13px var(--fuente); color: var(--tinta-2); cursor: pointer; }
  .pa-anim button.activo { background: var(--brillo), var(--pastilla); color: var(--tinta); box-shadow: var(--pastilla-sombra); }
  .pa-vacio { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--tinta-3); font-size: 14px; pointer-events: none; padding: 20px; }
  .pa-nota { font-size: 13px; color: var(--tinta-3); }
  [hidden] { display: none !important; }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<main class="pa">
  <header>
    <h1>Avatares con Avaturn</h1>
    <p>Página de prueba: crea aquí un avatar masculino y uno femenino con el editor de Avaturn y míralos con las animaciones de Lumen. No cambia tu avatar del Inicio; se guardan solo en este navegador.</p>
  </header>
  <section class="pa-escena">
    <div class="pa-slots">
      <div class="pa-slot"><b>Masculino</b><div class="fila"><button class="btn" data-crear="hombre">Crear con Avaturn</button><label class="btn">GLB<input type="file" accept=".glb" data-archivo="hombre"></label></div></div>
      <div class="pa-slot"><b>Femenino</b><div class="fila"><button class="btn" data-crear="mujer">Crear con Avaturn</button><label class="btn">GLB<input type="file" accept=".glb" data-archivo="mujer"></label></div></div>
    </div>
    <p class="pa-vacio">Aún no hay avatares. Pulsa «Crear con Avaturn».</p>
    <div class="pa-anim" role="group" aria-label="Animación">
      <button data-anim="idle" class="activo">Reposo</button><button data-anim="walk">Caminar</button><button data-anim="run">Correr</button><button data-anim="saludar">Saludar</button><button data-anim="agree">Asentir</button>
    </div>
  </section>
  <p class="pa-nota" id="info"></p>
</main>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { abrirAvaturn, cargarAvatarRealista } from './js/avatar/avaturn.js';

const cont = document.querySelector('.pa-escena');
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2));
r.toneMapping = THREE.NeutralToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
cont.prepend(r.domElement);
const esc = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); esc.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; esc.environmentIntensity = 0.55;
esc.add(new THREE.HemisphereLight(0xffffff, 0xe9ecf1, 0.5));
const sol = new THREE.DirectionalLight(0xfff6ee, 1.9); sol.position.set(-1.6, 3.6, 3.2); sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -2, right: 2, top: 2.5, bottom: -0.5 }); sol.shadow.bias = -0.0003; sol.shadow.normalBias = 0.02; sol.shadow.radius = 5; esc.add(sol);
const contra = new THREE.DirectionalLight(0xdfe9ff, 1.0); contra.position.set(2.2, 2.6, -2.8); esc.add(contra);
const suelo = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.ShadowMaterial({ opacity: 0.13 })); suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; esc.add(suelo);
const cam = new THREE.PerspectiveCamera(26, 1, 0.05, 50);
let az = 0, arr = null;
r.domElement.addEventListener('pointerdown', e => { arr = e.clientX; r.domElement.setPointerCapture(e.pointerId); });
r.domElement.addEventListener('pointermove', e => { if (arr !== null) { az -= (e.clientX - arr) * 0.01; arr = e.clientX; } });
r.domElement.addEventListener('pointerup', () => { arr = null; });

// IndexedDB solo para esta prueba
const bd = () => new Promise((ok, mal) => { const q = indexedDB.open('lumen-avatar-prueba', 1); q.onupgradeneeded = () => q.result.createObjectStore('glb'); q.onsuccess = () => ok(q.result); q.onerror = () => mal(q.error); });
const guardarGLB = async (k, blob) => { const db = await bd(); await new Promise(ok => { const t = db.transaction('glb', 'readwrite'); t.objectStore('glb').put(blob, k); t.oncomplete = ok; }); };
const leerGLB = async k => { const db = await bd(); return new Promise(ok => { const q = db.transaction('glb').objectStore('glb').get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); };

const slots = { hombre: null, mujer: null };
const X = { hombre: -0.55, mujer: 0.55 };
let anim = 'idle';
async function poner(k, blob) {
  try {
    const av = await cargarAvatarRealista(blob);
    slots[k]?.destruir();
    av.objeto.position.x = X[k];
    esc.add(av.objeto); slots[k] = av;
    av.estado(['idle', 'walk', 'run'].includes(anim) ? anim : 'idle');
    document.querySelector('.pa-vacio').hidden = true;
    info();
  } catch (e) { alert(`No se pudo cargar el avatar: ${e.message}`); console.warn(e); }
}
function info() {
  const t = Object.entries(slots).filter(([, v]) => v).map(([k, v]) => `${k === 'hombre' ? 'Masculino' : 'Femenino'}: ${(v.altura * 100).toFixed(0)} cm`);
  document.getElementById('info').textContent = t.join(' · ');
}
for (const k of ['hombre', 'mujer']) leerGLB(k).then(b => b && poner(k, b));

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.crear) {
    const k = b.dataset.crear;
    abrirAvaturn({ alExportar: async blob => { await guardarGLB(k, blob); await poner(k, blob); } });
  }
  if (b.dataset.anim) {
    anim = b.dataset.anim;
    document.querySelectorAll('[data-anim]').forEach(x => x.classList.toggle('activo', x === b && ['idle', 'walk', 'run'].includes(anim)));
    for (const v of Object.values(slots)) if (v) { if (['idle', 'walk', 'run'].includes(anim)) v.estado(anim); else v.gesto(anim); }
  }
});
document.addEventListener('change', async e => {
  const k = e.target.dataset.archivo; if (!k || !e.target.files[0]) return;
  const blob = e.target.files[0]; await guardarGLB(k, blob); poner(k, blob);
});

const reloj = new THREE.Clock();
function medir() { const w = cont.clientWidth, h = cont.clientHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
new ResizeObserver(medir).observe(cont); medir();
(function bucle() {
  requestAnimationFrame(bucle);
  const dt = Math.min(reloj.getDelta(), 0.05);
  for (const v of Object.values(slots)) v?.actualizar(dt);
  const d = cam.aspect < 1 ? 6.2 : 4.6;
  cam.position.set(Math.sin(az) * d, 1.1, Math.cos(az) * d); cam.lookAt(0, 0.92, 0);
  r.render(esc, cam);
})();
window.prueba = { poner, slots };
window.listo = true;
</script>
</body>
</html>
