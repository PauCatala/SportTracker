<!doctype html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lumen</title>

  <!-- App instalable (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F4F0E8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lumen">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">

  <!-- Tipografía: la del sistema (SF en Apple) e Inter como respaldo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Sora:wght@400;500;600;700&display=swap">
  <!-- 1º el diseño central, 2º los estilos de cada módulo, 3º la estructura de Lumen -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pulido.css">
  <link rel="stylesheet" href="css/v2.css">

  <!-- Gráficas (Chart.js) y nuestro código -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
  <!-- Three.js (copia local, r170) para la escena 3D del Inicio -->
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
  <script type="module" src="js/app.js"></script>
</head>
<body>

  <div id="app" class="lumen">
    <!-- Menú lateral (ordenador) -->
    <aside class="lateral-app">
      <b class="lateral-logo"><img src="icons/logo.svg" alt="" class="logo-marca">Lumen</b>
      <nav id="secciones" class="secciones" aria-label="Secciones"></nav>
      <div class="lateral-pie">
        <button id="btn-perfil" class="btn-perfil" aria-label="Tu cuenta" aria-haspopup="menu" aria-expanded="false"></button>
      </div>
    </aside>

    <div class="contenido">
      <header class="cabecera">
        <div class="cabecera-in">
          <div class="cabecera-fila">
            <div>
              <p class="fecha-hoy" id="fecha-hoy"></p>
              <h1 id="titulo-bloque">Resumen</h1>
              <p class="lema" id="lema"></p>
            </div>
            <div class="cabecera-der">
              <span id="estado-red" class="estado-red"></span>
              <button id="btn-entrar-movil" class="btn suave chico oculto">Entrar</button>
            </div>
          </div>
          <!-- Dentro de Salud: Gimnasio, Running, Flexibilidad, Nutrición -->
          <nav id="subbloques" class="subbloques oculto" aria-label="Apartados"></nav>
          <nav id="tabs" class="tabs oculto" aria-label="Pestañas"></nav>
        </div>
      </header>

      <main id="vista" class="vista"></main>
    </div>

    <!-- Barra inferior (móvil) -->
    <nav class="barra" aria-label="Secciones">
      <div class="barra-in" id="barra"></div>
    </nav>
  </div>

  <!-- Entrar (ventana) -->
  <section id="login" class="login oculto" role="dialog" aria-modal="true" aria-labelledby="login-titulo">
    <div class="login-caja">
      <button class="login-cerrar" id="login-cerrar" aria-label="Cerrar">×</button>
      <div>
        <img src="icons/logo.svg" alt="" class="logo-login">
        <h1 id="login-titulo">Lumen</h1>
        <p class="sub">Entra para guardar tus entrenos, tus estudios y tu progreso.</p>
      </div>
      <form id="form-login" class="campos" method="post" action="#" autocomplete="on">
        <label class="campo">Email <input type="email" id="login-email" name="email" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
        <label class="campo">Contraseña <input type="password" id="login-password" name="password" autocomplete="current-password" required></label>
        <button class="btn primario ancho" type="submit">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- Perfil (móvil) y su menú -->
  <button id="btn-perfil-movil" class="btn-perfil perfil-movil" aria-label="Tu cuenta" aria-haspopup="menu" aria-expanded="false"></button>
  <div id="menu-perfil" class="menu-perfil" role="menu" hidden>
    <p id="menu-cuenta">Sin cuenta</p>
    <button role="menuitem" data-menu="avatar"></button>
    <button role="menuitem" data-menu="perfil"></button>
    <button role="menuitem" id="btn-entrar" class="oculto"></button>
    <button role="menuitem" id="btn-salir" class="oculto"></button>
  </div>

  <div id="aviso" class="aviso" role="status"></div>
</body>
</html>
