<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sport Tracker</title>

  <!-- Esto convierte la web en "app instalable" (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/styles.css">

  <!-- Librería de gráficas (Chart.js), cargada desde un CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
  <!-- Nuestro código. type="module" permite repartirlo en varios archivos con import/export -->
  <script type="module" src="js/app.js"></script>
</head>
<body>

  <!-- ===== Pantalla de login ===== -->
  <section id="login" class="login oculto">
    <div class="login-caja">
      <h1>Sport Tracker</h1>
      <p class="sub">Inicia sesión para ver tu progreso</p>
      <form id="form-login">
        <label>Email <input type="email" name="email" autocomplete="username" required></label>
        <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn primario" type="submit">Entrar</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>
  </section>

  <!-- ===== La app ===== -->
  <div id="app" class="oculto">
    <header class="cabecera">
      <h1 id="titulo-bloque">Gimnasio</h1>
      <div class="cabecera-der">
        <span id="estado-red" class="estado-red"></span>
        <button id="btn-salir" class="btn-texto">Salir</button>
      </div>
    </header>

    <!-- Pestañas del bloque (Entrenar, Historial, Progreso...) -->
    <nav id="subnav" class="subnav"></nav>

    <!-- Aquí el JavaScript pinta la vista activa -->
    <main id="vista" class="vista"></main>

    <!-- Barra inferior con los 5 bloques -->
    <nav class="bloques">
      <button data-bloque="gym" class="activo">🏋️<span>Gimnasio</span></button>
      <button data-bloque="running">🏃<span>Running</span></button>
      <button data-bloque="flex">🧘<span>Flexibilidad</span></button>
      <button data-bloque="bici">🚴<span>Bici</span></button>
      <button data-bloque="nutricion">🥗<span>Nutrición</span></button>
    </nav>
  </div>

  <!-- Mensajes emergentes ("Sesión guardada ✔") -->
  <div id="aviso" class="aviso"></div>
</body>
</html>
