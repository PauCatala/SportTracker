<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sport Tracker</title>

  <!-- App instalable (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3F4F8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <!-- Tipografía: Archivo, con su eje de anchura (62–125 %) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Gráficas (Chart.js) y nuestro código -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>

  <!-- ===== Login ===== -->
  <section id="login" class="login oculto">
    <div class="login-caja">
      <img src="icons/icon-192.png" alt="">
      <div>
        <h1>Sport Tracker</h1>
        <p class="sub">Gimnasio, carrera y flexibilidad, todo medido.</p>
      </div>
      <form id="form-login" class="campos">
        <label class="campo">Email <input type="email" name="email" autocomplete="username" required></label>
        <label class="campo">Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn primario ancho" type="submit">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- ===== App ===== -->
  <div id="app" class="oculto">
    <header class="cabecera">
      <div class="cabecera-in">
        <div class="cabecera-fila">
          <div>
            <p class="fecha-hoy" id="fecha-hoy"></p>
            <h1 id="titulo-bloque">Gimnasio</h1>
          </div>
          <div class="cabecera-der">
            <span id="estado-red" class="estado-red"></span>
            <button id="btn-salir" class="btn-icono" aria-label="Cerrar sesión"></button>
          </div>
        </div>
        <nav id="tabs" class="tabs" aria-label="Secciones"></nav>
      </div>
    </header>

    <main id="vista" class="vista"></main>

    <nav class="barra" aria-label="Bloques">
      <div class="barra-in" id="barra"></div>
    </nav>
  </div>

  <div id="aviso" class="aviso" role="status"></div>
</body>
</html>
