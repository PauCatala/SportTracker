<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lumen · Organiza tu día entero</title>
  <meta name="description" content="Estudio, entreno, nutrición y tu día a día en una sola app.">
  <meta name="theme-color" content="#F4F0E8">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    /* =================================================================
       INTRO DE LUMEN
       Un único vídeo (media/intro.mp4) montado a partir de las imágenes y
       vídeos generados: la pared se agrieta y se rasga, sale el reloj, los
       números vuelan a su sitio, las agujas corren hasta las 3:55, se
       convierten en un portátil… y la pantalla del portátil es la app real.
       Encima del vídeo solo hay HTML: el texto y la app (siempre nítidos).
       ================================================================= */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--hueso); overflow: hidden; }
    body { font-family: var(--fuente); color: var(--tinta); -webkit-font-smoothing: antialiased; }

    .escena { position: fixed; inset: 0; overflow: hidden; background: var(--hueso); }
    /* El vídeo lo coloca el script: en horizontal cubre toda la pantalla;
       en vertical (móvil) se ajusta para que el reloj quepa entero y los bordes se funden con la pared */
    .escena video { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .vertical .escena video {
      -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent);
      mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent);
    }

    /* Marca arriba a la izquierda, como en apple.com: discreta */
    .marca {
      position: absolute; top: calc(env(safe-area-inset-top) + 22px); left: 28px; z-index: 5;
      font-family: var(--fuente-titulo); font-weight: 700; font-size: 19px; letter-spacing: -0.03em;
      color: var(--marino); transition: opacity .6s var(--curva);
    }

    /* "Today." / "Tomorrow." (tachado a mano) */
    .frase {
      position: absolute; z-index: 4; left: 4vw; top: 50%; transform: translateY(-50%);
      font-family: var(--fuente-titulo); font-weight: 700; letter-spacing: -0.045em; line-height: .95;
      font-size: clamp(40px, 4vw, 76px); pointer-events: none;
    }
    .frase p { margin: 0; opacity: 0; transform: translateY(18px); transition: opacity .7s var(--curva-salida), transform .9s var(--curva-salida); }
    .frase p.ver { opacity: 1; transform: none; }
    .frase .hoy { color: var(--marino); }
    .frase .manana { position: relative; display: inline-block; color: var(--gris-mate-2); }
    .frase .manana svg { position: absolute; left: -4%; top: 38%; width: 108%; height: 40%; overflow: visible; }
    .frase .manana path {
      fill: none; stroke: #2B4FA8; stroke-width: 7; stroke-linecap: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .5s cubic-bezier(.6, 0, .3, 1);
    }
    .frase .manana.tachar path { stroke-dashoffset: 0; }
    .frase.fuera p { opacity: 0; transform: translateY(-14px); transition-duration: .45s; }
    .vertical .frase { left: 0; right: 0; top: calc(env(safe-area-inset-top) + 9vh); transform: none; text-align: center; font-size: clamp(40px, 12vw, 60px); }

    /* La app real, encajada en la pantalla del portátil y luego a pantalla completa */
    .pantalla {
      position: absolute; z-index: 3; left: 0; top: 0; width: 0; height: 0; overflow: hidden;
      opacity: 0; border-radius: 6px; background: var(--hueso); will-change: transform, width, height;
    }
    .pantalla iframe {
      position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: var(--hueso);
    }
    .pantalla.completa { border-radius: 0; }

    /* Controles discretos */
    .controles {
      position: absolute; z-index: 6; right: 22px; bottom: calc(env(safe-area-inset-bottom) + 22px);
      display: flex; gap: 8px; transition: opacity .5s var(--curva);
    }
    .controles button {
      min-height: 34px; padding: 0 16px; border: 0; border-radius: 999px; cursor: pointer;
      background: rgba(251, 249, 245, .72); color: var(--tinta-2); font: inherit; font-size: 13px; font-weight: 500;
      backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px);
      box-shadow: 0 1px 2px rgba(29, 37, 56, .08); transition: background .3s, color .3s;
    }
    .controles button:hover { background: var(--crema); color: var(--tinta); }
    .oculto { opacity: 0 !important; pointer-events: none !important; }


  </style>
</head>
<body>
  <main class="escena cargando" id="escena">
    <video id="video" muted playsinline preload="auto" poster="media/intro-poster.jpg" aria-label="Intro de Lumen: un reloj sale de la pared y se convierte en un portátil">
      <source src="media/intro.mp4" type="video/mp4">
      <source src="media/intro.webm" type="video/webm">
    </video>

    <span class="marca" id="marca">Lumen</span>

    <div class="frase" id="frase" aria-live="polite">
      <p class="hoy" id="hoy">Today.</p>
      <p class="manana" id="manana">Tomorrow.<svg viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M2 13 C 20 9, 38 15, 55 10 S 85 6, 98 9"/></svg></p>
    </div>

    <div class="pantalla" id="pantalla">
      <iframe id="app" src="index.html#hoy" title="Lumen" tabindex="-1"></iframe>
    </div>

    <div class="controles" id="controles">
      <button id="repetir" class="oculto">Repetir</button>
      <button id="saltar">Saltar intro</button>
    </div>
  </main>

  <script>
    // ---------------------------------------------------------------
    // Datos del montaje (salen del script que genera el vídeo)
    // ---------------------------------------------------------------
    const VIDEO_W = 1280, VIDEO_H = 720;
    const M = {               // segundos del vídeo
      hoy: 7.55,              // aparece "Today."
      manana: 7.8,            // aparece "Tomorrow."
      tachar: 8.15,           // se tacha "Tomorrow."
      fueraFrase: 10.25,      // la frase se va antes de que las agujas se conviertan en portátil
      hInicio: 14.45, hDur: 1.8,                  // acercamiento a la pantalla del portátil
      pantalla: [407.6, 185.0, 874.6, 504.8],    // pantalla del portátil en el vídeo (x0, y0, x1, y1)
    };

    const $ = id => document.getElementById(id);
    const video = $('video'), escena = $('escena'), pantalla = $('pantalla'), app = $('app');
    const lim = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const suave = t => t * t * (3 - 2 * t);
    const suaveIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const sinMovimiento = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Escala del vídeo: en horizontal lo cubre todo; en vertical, que el reloj (≈620 px del vídeo) quepa a lo ancho
    const PARED = [198, 192, 179], HUESO = [244, 240, 232];
    let escalaVideo = 1;
    function colocarVideo() {
      const W = innerWidth, H = innerHeight;
      const vertical = W / H < 1;
      document.documentElement.classList.toggle('vertical', vertical);
      escalaVideo = vertical ? Math.min(H / VIDEO_H, W / 620) : Math.max(W / VIDEO_W, H / VIDEO_H);
      video.style.width = `${VIDEO_W * escalaVideo}px`;
      video.style.height = `${VIDEO_H * escalaVideo}px`;
    }
    // Del sistema de coordenadas del vídeo (1280x720) a la pantalla
    function aPantalla(x, y) {
      const s = escalaVideo;
      return [innerWidth / 2 + (x - VIDEO_W / 2) * s, innerHeight / 2 + (y - VIDEO_H / 2) * s, s];
    }

    // ---------------------------------------------------------------
    // La app dentro de la pantalla del portátil: sigue el acercamiento del vídeo
    // (mismas fórmulas que el montaje: zoom alrededor del centro de la pantalla)
    // ---------------------------------------------------------------
    function colocarPantalla(t) {
      const u = lim((t - M.hInicio) / M.hDur);
      // En vertical, el fondo es la pared y al final pasa al color de la app
      if (document.documentElement.classList.contains('vertical')) {
        const c = PARED.map((v, i) => Math.round(v + (HUESO[i] - v) * suave(lim((u - 0.2) / 0.8))));
        escena.style.background = `rgb(${c})`;
      }
      if (u <= 0.3) { pantalla.style.opacity = 0; return; }
      const [x0, y0, x1, y1] = M.pantalla;
      const pc = [(x0 + x1) / 2, (y0 + y1) / 2];
      const sFin = Math.max(VIDEO_W / (x1 - x0), VIDEO_H / (y1 - y0)) * 1.12;
      const k = suaveIO(lim((u - 0.15) / 0.85));
      const s = 1 + (sFin - 1) * k;
      const dx = pc[0] + (VIDEO_W / 2 - pc[0]) * k, dy = pc[1] + (VIDEO_H / 2 - pc[1]) * k;
      const p = (x, y) => aPantalla(s * (x - pc[0]) + dx, s * (y - pc[1]) + dy);
      let [ax, ay] = p(x0, y0), [bx, by] = p(x1, y1);
      // Al final la pantalla se convierte en la ventana entera
      const f = suave(lim((u - 0.62) / 0.38));
      ax += (0 - ax) * f; ay += (0 - ay) * f; bx += (innerWidth - bx) * f; by += (innerHeight - by) * f;
      const w = bx - ax, h = by - ay;
      Object.assign(pantalla.style, { left: `${ax}px`, top: `${ay}px`, width: `${w}px`, height: `${h}px`, opacity: suave(lim((u - 0.3) / 0.3)) });
      // En el portátil la app se ve como en un ordenador (1180 px de ancho); al final, al tamaño de tu ventana
      const anchoLogico = Math.max(innerWidth, 1180) + (innerWidth - Math.max(innerWidth, 1180)) * f;
      const esc = w / anchoLogico;
      Object.assign(app.style, { width: `${anchoLogico}px`, height: `${h / esc}px`, transform: `scale(${esc})` });
      pantalla.style.borderRadius = `${6 * (1 - f)}px`;
    }

    // ---------------------------------------------------------------
    // Texto y estados según el tiempo del vídeo
    // ---------------------------------------------------------------
    function pintar() {
      const t = video.currentTime;
      $('hoy').classList.toggle('ver', t >= M.hoy);
      $('manana').classList.toggle('ver', t >= M.manana);
      $('manana').classList.toggle('tachar', t >= M.tachar);
      $('frase').classList.toggle('fuera', t >= M.fueraFrase);
      $('marca').classList.toggle('oculto', t >= M.hInicio);
      colocarPantalla(t);
    }

    let terminado = false;
    function terminar() {
      if (terminado) return;
      terminado = true;
      video.pause();
      pantalla.classList.add('completa');
      Object.assign(pantalla.style, { left: 0, top: 0, width: '100%', height: '100%', opacity: 1, borderRadius: 0 });
      Object.assign(app.style, { width: '100%', height: '100%', transform: 'none' });
      app.tabIndex = 0;
      $('saltar').classList.add('oculto');
      $('repetir').classList.remove('oculto');
      $('marca').classList.add('oculto');
      escena.style.background = `rgb(${HUESO})`;
      setTimeout(() => { video.style.visibility = 'hidden'; }, 300);
    }

    function bucle() {
      if (!terminado) pintar();
      requestAnimationFrame(bucle);
    }

    colocarVideo();
    addEventListener('resize', colocarVideo);
    escena.style.background = matchMedia('(max-aspect-ratio: 1/1)').matches ? `rgb(${PARED})` : '';
    video.addEventListener('playing', () => escena.classList.remove('cargando'));
    video.addEventListener('ended', terminar);
    addEventListener('resize', () => { if (terminado) { app.style.width = app.style.height = '100%'; } });
    $('saltar').onclick = terminar;
    $('repetir').onclick = () => {
      terminado = false;
      video.style.visibility = '';
      pantalla.classList.remove('completa');
      pantalla.style.opacity = 0;
      app.tabIndex = -1;
      $('repetir').classList.add('oculto');
      $('saltar').classList.remove('oculto');
      $('marca').classList.remove('oculto');
      video.currentTime = 0; video.play();
    };

    if (sinMovimiento) {
      escena.classList.remove('cargando');
      terminar();
    } else {
      // Empieza en cuanto puede reproducirse sin cortes
      const empezar = () => video.play().catch(() => { escena.classList.remove('cargando'); });
      if (video.readyState >= 3) empezar(); else video.addEventListener('canplaythrough', empezar, { once: true });
      requestAnimationFrame(bucle);
    }
  </script>
</body>
</html>
